name: Publish to npm

on:
  push:
    branches:
      - main
      - beta

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run linter and format check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Run compatibility tests
        run: npm run test:compat

      - name: Check if version has been bumped
        id: version-check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            NPM_VERSION=$(npm view $(node -p "require('./package.json').name") version)
          elif [ "${{ github.ref }}" == "refs/heads/beta" ]; then
            NPM_VERSION=$(npm view $(node -p "require('./package.json').name") dist-tags.beta)
          else
            echo "This branch is not configured for publishing."
            echo "bumped=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$VERSION" = "$NPM_VERSION" ]; then
            echo "Version has not been bumped."
            echo "bumped=false" >> $GITHUB_OUTPUT
          else
            echo "Version has been bumped."
            echo "bumped=true" >> $GITHUB_OUTPUT
          fi

      - name: Build
        if: steps.version-check.outputs.bumped == 'true'
        run: npm run build

      - name: Publish to npm
        if: steps.version-check.outputs.bumped == 'true'
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            npm publish
          elif [ "${{ github.ref }}" == "refs/heads/beta" ]; then
            npm publish --tag beta
          fi
